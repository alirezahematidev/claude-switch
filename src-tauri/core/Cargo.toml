[package]
name = "claude-switch-core"
version = "0.1.0"
description = "Claude Switch's application core: accounts, profiles, sessions and conversations, without a UI"
authors = ["Claude Switch contributors"]
license = "MIT"
publish = false
edition = "2021"
rust-version = "1.85"

[lib]
name = "claude_switch_core"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = { version = "0.4", features = ["std"] }
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
rusqlite = { version = "0.41", features = ["bundled"] }
portable-pty = "0.9"
libc = "0.2"
ts-rs = { version = "12", features = ["serde-compat", "no-serde-warnings"] }
jsonc-parser = { version = "0.34", features = ["cst", "serde_json"] }

[dev-dependencies]
tempfile = "3"
