[package]
name = "claude-switch"
version = "0.1.1"
description = "Local-first macOS manager for multiple Claude Code accounts"
authors = ["Claude Switch contributors"]
license = "MIT"
repository = "https://github.com/alirezahematidev/claude-switch"
homepage = "https://github.com/alirezahematidev/claude-switch"
publish = false
edition = "2021"
rust-version = "1.85"

[lib]
# The `_lib` suffix avoids a name clash with the binary target on Windows.
name = "claude_switch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-notification = "2.7"
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-autostart = "2.7"
tauri-plugin-single-instance = "2.5"
tauri-plugin-opener = "2.7"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = { version = "0.4", features = ["std"] }
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
rusqlite = { version = "0.41", features = ["bundled"] }
portable-pty = "0.9"
libc = "0.2"
ts-rs = { version = "12", features = ["serde-compat", "no-serde-warnings"] }
jsonc-parser = { version = "0.34", features = ["cst", "serde_json"] }

[dev-dependencies]
tempfile = "3"
tauri = { version = "2.12", features = ["tray-icon", "image-png", "test"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
